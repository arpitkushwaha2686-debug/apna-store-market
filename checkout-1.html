function save(){localStorage.setItem('asm_cart',JSON.stringify(c));render()}
function render(){if(!c.length){items.innerHTML='<div style="color:#9da7b8;padding:18px 0">Cart empty hai. Store par wapas jaakar product add karein.</div>';total.textContent='₹0';document.getElementById('submitBtn').disabled=true;return}document.getElementById('submitBtn').disabled=false;items.innerHTML=c.map((x,i)=>`<div class="item"><div><b>${x.name}</b><div class="muted">${x.category||''}</div><div class="qty"><button class="qbtn" onclick="changeQty(${i},-1)">−</button><span>${x.qty||1}</span><button class="qbtn" onclick="changeQty(${i},1)">+</button></div></div><div class="price">₹${x.price*(x.qty||1)}</div></div>`).join('');total.textContent='₹'+c.reduce((s,x)=>s+x.price*(x.qty||1),0)}
